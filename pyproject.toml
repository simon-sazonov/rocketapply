[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "2.0.0"
description = "PitWall — a motorsport networking lead finder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

# Declared here as well as in requirements.txt so that `pip install -e .`
# enforces the floors at INSTALL time rather than at import time. The two that
# matter:
#   pydantic-settings >= 2.7  first release with `NoDecode` (config.py:24)
#   python            >= 3.11 `match` statements, `X | None`, `datetime.UTC`
# Between them, `pip install -e .` on the system Anaconda 3.13 interpreter now
# fails while naming its own cause instead of blowing up later on an import.
dependencies = [
  "streamlit>=1.40",
  "pandas>=2.2",
  "pydantic>=2.9",
  "pydantic-settings>=2.7",
  "python-dotenv>=1.0",
  "ddgs>=9.10",
  "httpx>=0.27",
  "tenacity>=9.0",
  # The MX check of §3.2 in PITWALL_V3_EMAIL_ENRICHMENT.md. Optional at
  # runtime — `enrich/checks.py` degrades to "unknown" without it.
  "dnspython>=2.7",
  "openai>=1.50",
  "rapidfuzz>=3.10",
  "python-slugify>=8.0",
  "PyYAML>=6.0",
  "Jinja2>=3.1",
  "typer>=0.12",
  "rich>=13.9",
  "altair>=5.4",
  "openpyxl>=3.1",
  # The CV/cover-letter engine (CV_COVER_LETTER_ENGINEERING_SPEC.md). All three
  # are pure-Python wheels: no Homebrew, no LibreOffice, no system libraries.
  # reportlab is also what makes the line-cost model a MEASUREMENT rather than
  # a character-count estimate — see src/pitwall/apply/layout.py.
  "reportlab>=4.2",
  "python-docx>=1.1",
  "pypdf>=5.0",
  # Instantiates static weights from the upstream variable fonts;
  # used only by scripts/fetch_fonts.py, never at generation time.
  "fonttools>=4.50",
  # CV preview in the Applications Studio; the page degrades to a
  # download button without it.
  "pypdfium2>=4.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-cov>=5.0", "ruff>=0.7", "mypy>=1.13"]

# `pitwall init` and friends. The same Typer app is also reachable without
# installing, via `python scripts/run_pipeline.py`.
[project.scripts]
pitwall = "pitwall.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitwall = ["scoring/prompts/*.txt", "scoring/prompts/*.j2", "apply/prompts/*.md"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "scripts", "tests"]
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"scripts/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
# No python_version pin: mypy uses the running interpreter. numpy's bundled
# stubs need >= 3.12, while ruff's target-version = "py311" is what keeps the
# code we write compatible with the 3.11 floor in [project].
mypy_path = "src"
packages = ["pitwall"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/pitwall"]
omit = ["*/scoring/llm.py", "*/search/ddg.py", "*/search/serper.py", "*/search/searxng.py"]
