[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pitwall"
version = "1.0.0"
description = "PitWall — a motorsport networking lead finder"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pitwall = ["scoring/prompts/*.txt", "scoring/prompts/*.j2"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "app", "scripts", "tests"]
exclude = [".venv", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM"]
ignore = ["E501", "B008", "SIM108"]

[tool.ruff.lint.per-file-ignores]
"app/**" = ["E402"]
"scripts/**" = ["E402"]
"tests/**" = ["E402"]

[tool.mypy]
# No python_version pin: mypy uses the running interpreter. numpy's bundled
# stubs need >= 3.12, while ruff's target-version = "py311" is what keeps the
# code we write compatible with the 3.11 floor in [project].
mypy_path = "src"
packages = ["pitwall"]
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["src/pitwall"]
omit = ["*/scoring/llm.py", "*/search/ddg.py", "*/search/serper.py", "*/search/searxng.py"]
