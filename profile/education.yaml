        title: "Risk-Aware Race Strategy Under Disruption"
        title_plain: "Making decisions when something can suddenly go wrong"
        subtitle: "An agent that protects against bad outcomes, tested on Formula 1 race strategy"
        supervisor: "not yet confirmed - proposals out to NOVA IMS staff, Sep 2026"
        start: 2026-09
        summary: >
          Models Formula 1 safety-car and virtual-safety-car deployment as a discrete-time
          hierarchical hazard function fitted to FastF1 race-control messages across seasons
          2018-2026, then couples the fitted hazard to a pit-stop strategy agent optimised
          for the bad tail rather than the expected case.
        # Measured before the first supervisor meeting, not estimated. Reproducible from src/.
        measured_findings:
          - "3,510 race-lap risk sets and 83 SC/VSC deployments across the three strictly complete seasons (2018-2020, 59 races); base hazard 2.36% per race-lap"
          - "circuit FIXED effects collapse out of sample (hold-out calibration slope -0.007 on 26 free parameters over 55 training events) while circuit RANDOM effects fit (tau = 0.241) - the partial pooling is load-bearing, not a refinement"
          - "per-lap hazard appears to shift at the 2022 regulation boundary (0.023 -> 0.036, p = 0.018), so the pooling window straddles a structural break"
          - "got TUMFTM/race-simulation (pinned to a 2020 stack) running on Python 3.13 with two shims; 200 Monte Carlo races in 21.9 s, 110 ms/race single-process"
          - "DRS telemetry is silently degenerate in the 2026 feed, not absent: ~427,000 samples across 22 cars, every value zero - a naive transfer reads that as 'DRS never deployed' instead of failing loudly"
          - "citation audit corrected the proposal's own pitch: the two ETH papers share three of four authors, so they are one lab's paper N and N+1, not two independent groups"
        honesty_notes:
