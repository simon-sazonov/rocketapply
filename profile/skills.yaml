# skills.yaml — four fixed rows, variable contents.
#
# WHAT CHANGED FROM THE FLAT LIST YOU SENT, AND WHY
# Your list is good raw material but is not yet a profile file. Four things were added:
#   1. `row` - which of the four CV rows each item can print in. Without it the packer
#      cannot fill a row, because it does not know what belongs there.
#   2. `confidence` + `evidence` - the honesty mechanism. A skill with no bullet id
#      behind it cannot be `high`. This one rule removes the commonest CV lie.
#   3. Printable NAMES, separated from concepts. "Decision-Making under Uncertainty"
#      is a theme for matching, not a string that earns 33 of 195 characters on a CV
#      row. Concepts stay searchable via `tags`; only short names get printable: true.
#   4. De-duplication. Your list had the same capability at several altitudes
#      (e.g. "Reinforcement Learning" and "Q-Learning / SARSA / Double Q-Learning").
#      One skill record now carries the fine-grained forms as `aliases`, so matching
#      still fires on the specific term while the CV prints the readable one.
#
# ─────────────────── SUPERSEDED 24 Sep 2026 — Simon's instruction ───────────────────
# R, TypeScript, C# and Forecasting are REAL and supported. The public portfolio is a
# subset of his work; some projects are private and cannot be published. `evidence: []`
# on a skill therefore means "no PUBLIC bullet to cite", never "no experience".
# Such skills carry `evidence_private: true`, print normally, and are usable in letters.
# The CV/letter rule that still stands: cite a named public project only where one exists.
# The reason is that the two are different sizes of claim. "R" as one token in a
# comma-separated list is a weak, conventional signal. A sentence in a letter - "my
# experience with R" - is a specific, elaborated, checkable assertion, and it is the
# one an interviewer follows up on. The override covers the claim you made; it does
# not silently grow into a bigger one.
# To lift it entirely: delete the letter_policy lines. To revert: printable: false.

rows:
  row.programming:
    lines: 1
    max_chars: 95
    pinned: [Python, SQL]
  row.methods:
    lines: 2
    max_chars: 195
    pinned: [Machine Learning]
  row.tools:
    lines: 2
    max_chars: 195
    pinned: [pandas, scikit-learn]
  row.spoken:
    lines: 1
    max_chars: 105
    fixed: true
    fixed_text: "English(fluent - MSc taught in English), Ukrainian(native), Russian(native), Portuguese(B1), Italian(A2)"

skills:

  # ─────────────── canonical tags added as aliases, 24 Sep 2026 ───────────────
  # Eighteen records had a canonical tag on their bullets that no alias matched:
  # skill.testing is named "Testing & QA", so the tag `testing` resolved to
  # nothing and a posting asking for it read as a GAP on a profile with six
  # bullets of evidence. Adding the tag as an alias changes no claim, no
  # confidence and no evidence — it only lets the matcher find what was already
  # there. Derived from bullet tags, not invented.

