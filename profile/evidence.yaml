- id: ev.thesis
  title: Modelling the disruption instead of the strategy
  source_refs: [proj.thesis.b1, proj.thesis.b2, edu.msc]
  facts:
    - modelling F1 safety-car and virtual-safety-car deployment as a discrete-time hierarchical hazard function
    - fitted to FastF1 race-control messages across seasons 2018 to 2026
    - measured 3,510 race-lap risk sets and 83 deployments across the three strictly complete seasons before committing to the design
    - found circuit fixed effects collapse out of sample while circuit random effects fit, so the partial pooling is load-bearing
    # REVIVAL FIRST, and deliberately. Written the other way round — "got an
    # abandoned 2020-stack race simulator running" — a letter turned it into
    # "I built an abandoned 2020-stack race simulator": every word grounded,
    # the meaning inverted, and the gates passed it because they check tokens
    # rather than sense. The adjective has to sit next to what it describes.
    - revived TUMFTM's race simulator, abandoned on a 2020 stack, onto Python 3.13 with two shims, reaching 110 ms per Monte Carlo race
    - the strategy agent is optimised for the bad tail rather than the expected case
  skills: [statistics, probability, risk_modelling, decision_making, simulation, time_series, reinforcement_learning]
  themes: [decision_under_uncertainty, applied_research, measurement_before_commitment, real_time_decisions]
  use_for: [research, quantitative, data_science, machine_learning]
  strength: strong
  one_line_hook: >
    Existing race-strategy agents optimise the average race. Races are lost in the tail,
    on the lap a safety car comes out and a twenty-second pit stop suddenly costs nothing.
  story: >
    This is what I am working on right now. It is interesting to use a simulator that
    already exists and try to predict the different possibilities and the different risks.
    What makes it promising is that the idea is not limited to motorsport - the same thing
    applies in finance. It is also genuinely challenging, both on the statistics side and
    on the reinforcement-learning side, with CVaR and the risk-sensitive part I am
    implementing now.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

