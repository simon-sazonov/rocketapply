- id: ev.monte_carlo_risk
  title: Deciding whether a trade is worth taking at all
  source_refs: [ophis.b2, ophis.b3, proj.montecarlo_risk.b1, proj.montecarlo_risk.b2]
  facts:
    - built a pre-trade risk filter that simulates thousands of price paths for one trade candidate
    - generated paths two ways - parametric geometric Brownian motion and bootstrap resampling of historical returns
    - replayed each simulated path under the strategy's production exit rules
    - computed probability of loss, VaR, CVaR, Kelly fraction, Sharpe and profit factor per candidate
    - returned a graded accept, reduce or reject decision rather than a binary filter
    - tuned the decision thresholds by walk-forward Optuna optimisation rather than setting them by hand
  skills: [monte_carlo, simulation, risk_modelling, probability, decision_making, optimization]
  themes: [decision_under_uncertainty, risk_weighted_decisions, simulation_fidelity]
  use_for: [quantitative, data_science, research, machine_learning]
  strength: strong
  one_line_hook: >
    A single expected return tells you almost nothing about whether to take a trade;
    the shape of the distribution around it tells you everything.
  story: >
    The maths itself was not the interesting part. What I got out of it was building
    something that had to run in a real financial environment rather than in a notebook -
    taking a model and putting it into the rhythm of the tools we already had. The
    problem worth solving was the logic underneath: making the numbers mean something,
    and framing them so they gave the most value to the tools that would consume them.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

- id: ev.rl_sepsis
  title: Sequential treatment decisions under a sparse reward
  source_refs: [proj.rl_sepsis.b1, proj.rl_sepsis.b2]
  facts:
    - modelled ICU sepsis treatment as an episodic MDP where survival is observed only at episode end
    - benchmarked tabular methods (Q-Learning, SARSA, Double Q-Learning, Value Iteration) against linear function approximation, DQN and PPO
    - wrapped the environment with observation noise, randomly missing features and acute deterioration events
    - added SOFA-delta reward shaping to attack the sparse-reward problem
    - ran a Pareto sweep trading survival against treatment intensity
    - found that deep RL did not beat a linear model at the available training budget
  skills: [reinforcement_learning, decision_making, experimental_design, deep_learning, multi_objective]
  themes: [decision_under_uncertainty, sequential_decisions, negative_results, applied_research]
  use_for: [machine_learning, research, data_science, quantitative]
  strength: strong
  one_line_hook: >
    Credit assignment was the limitation here: the only signal arrives at the end, and by
    then there are hundreds of decisions to explain it.
  story: >
    We tried a lot of different methods - SARSA, Q-learning, double Q-learning. We never
    got a perfect number out of any of them, and double Q-learning actually came in below
    the baseline. But the numbers were not really the point. What I got from it was
    understanding how these methods learn, which matters more to me than the final figure.
    The baseline looked fine on a single run; if you look at the learning process instead,
    the comparison is much more valuable.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

- id: ev.optimisation_rigour
  title: Making an optimisation comparison actually mean something
  source_refs: [proj.ga_image.b1, proj.ga_image.b2]
  facts:
    - built a genetic algorithm for a 1,000-dimensional integer optimisation problem
    - designed crossover to operate at whole-triangle granularity so shape and colour stayed co-adapted
    - tuned in stages - one-at-a-time experiments to set defensible ranges, then Optuna TPE over those ranges, then structural ablations
    - validated across 30 seeds with Mann-Whitney U and Wilcoxon tests
    - compared the genetic algorithm against simulated annealing at an equal 63,000-evaluation budget and found it gave substantially lower variability (SD 0.70 vs 4.41), although the difference in means was not statistically significant
    - an independent replication reproduced the final result
  skills: [optimization, genetic_algorithms, statistics, experimental_design, hyperparameter_tuning]
  themes: [experimental_rigour, fair_comparison, reproducibility]
  use_for: [research, quantitative, machine_learning, data_science]
  strength: strong
  one_line_hook: >
    Most algorithm comparisons are won by whichever one got tuned harder. I gave both the
    same budget and 30 seeds, so the result was not down to one lucky run.
  story: >
    This was a chance to put optimisation techniques onto a problem that is not a standard
    modelling problem. We tried simulated annealing and genetic algorithms. The experience
    I wanted was combining and fine-tuning the parameters, and understanding what is
    actually happening behind every single one of them - how the thing learns, how big the
    search space should be, and how to get better results without increasing the cost.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

- id: ev.pitwall
  title: Building a system that degrades instead of failing
  source_refs: [proj.pitwall.b1, proj.pitwall.b2]
  facts:
    - designed and built a seven-stage resumable pipeline solo, from search through scoring to a CRM interface
    - combined explainable heuristic scoring with batched LLM verdicts carrying reasons and red flags
    - hand-labelled a 60-candidate evaluation set and chose the operating threshold from a precision-recall sweep
    - accepted lower precision to hold a 0.90 recall floor because a missed lead costs more than a wasted review
    - built provider fallback chains for both search and inference so an exhausted provider disables itself mid-run
    - wrote 260 hermetic tests at roughly 90% coverage, with real search captures saved as fixtures
  skills: [system_design, llm, threshold_tuning, testing, decision_making, entity_resolution]
  themes: [graceful_degradation, precision_recall_tradeoff, scope_discipline, solo_ownership]
  use_for: [machine_learning, software, data_science, research]
  strength: strong
  one_line_hook: >
    Finding links is easy. Deciding which links are real - the same name at four
    different companies, people who left in 2019 - is the actual problem.
  story: >
    It started as a project for finding people and turned into something else: a reason to
    work with open-weight models through their APIs. Getting the data, analysing it, and
    teaching the model the specific area I was looking for. That is the part I would do again.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

- id: ev.model_selection
  title: Knowing when the model is not the bottleneck
  source_refs: [proj.tweet_sentiment.b1, proj.tweet_sentiment.b2, proj.painter_cnn.b1, proj.painter_cnn.b2]
  facts:
    - benchmarked 29 configurations on a three-class financial sentiment task from bag-of-words to a fine-tuned transformer
    - used macro-F1 under class imbalance and touched the test split exactly once
    - fitted every vectoriser inside the training fold so the pipeline stayed leak-free
    - ran a separate one-factor-at-a-time ablation on a 23-class image task, starting from an underfitting diagnosis
    - documented two negative results - over-regularisation and a failed rare-class specialist
    - traced residual errors to cases where the gold labels themselves are debatable
  skills: [model_evaluation, cross_validation, nlp, deep_learning, class_imbalance, experimental_design]
  themes: [diagnosis_over_score_chasing, negative_results, data_ceiling]
  use_for: [machine_learning, data_science, research]
  strength: strong
  one_line_hook: >
    The 29 configurations ranked almost exactly by how much pretrained knowledge and
    labelled data each one consumed. That ordering is the finding, not the leaderboard.
  story: >
    The painter project was deep learning built from our side, from scratch rather than
    starting from pre-trained weights. It was fun to work with the layers - the convolution
    layers, the dense layers - and it is where I actually understood how these models work,
    how the neurons communicate, backpropagation, hands on rather than described. The
    text-mining project was the other half of that: fine-tuning models that had already
    been trained, RoBERTa and the rest. Doing both is what made the difference between them
    clear to me.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

- id: ev.data_engineering
  title: Treating the pipeline as the deliverable
  source_refs: [proj.f1_warehouse.b1, proj.f1_warehouse.b2, proj.covid_mlops.b1, proj.covid_mlops.b2, proj.airbnb_mongo.b1, proj.airbnb_mongo.b2]
  facts:
    - built a medallion bronze-silver-gold pipeline over 74 years of data in 14 tables with explicit schemas and referential-integrity checks
    - modelled a star-schema gold layer with slowly-changing dimensions
    - co-built a ten-stage Kedro lifecycle from ingestion through a Parquet feature store to a containerised FastAPI service
    - added drift monitoring with PSI, KS and Jensen-Shannon statistics
    - wrote tests proving the served predictions match the trained model
    - normalised a denormalised MongoDB schema and proved each index change against explain plans
  skills: [etl, dimensional_modelling, mlops, data_quality, query_optimization, big_data]
  themes: [lifecycle_thinking, data_contracts, measurable_optimisation]
  use_for: [data_engineering, machine_learning, data_science, analytics]
  strength: strong
  one_line_hook: >
    Proving the served predictions match the trained model catches failures before they
    propagate into downstream analysis.
  story: >
    This was about taking machine learning I already knew - clustering, k-means, the
    standard models - and running it on actual big data with PySpark. The libraries are a
    little different and so is the behaviour. The real lesson is what big-data analysis
    looks like in practice, when you cannot just put everything into a dataframe and hope
    for the best, or wait days for a simple table-to-table analysis to come back.
  needs_simon_rewrite: false
  story_source: "Simon, dictated 24 Sep 2026 - his content and phrasing, transcribed to sentences"

