# projects.yaml — THE VARIABLE SLOT. Exactly 3 print on any given CV.
# (Never hard-code a count here; validate_profile.py prints the live one every run.
#  A hand-written count is a future lie - this one already drifted 18 -> 22.)
#
# Shape rules, enforced by validate_profile.py:
#   - exactly 2 bullets per project
#   - every bullet <= 95 characters, so every project costs exactly 3 rendered lines
#   - title + link label <= 90 characters
#   - any 3 projects therefore cost 9 of the 11-line budget, with slack to spare
#
# readme_state: checked live against GitHub on 24 Sep 2026.
#   ok   — a README that explains the problem and the result
#   stub — title only. §6 of the spec: "an empty repo is worse than no link",
#          because a linked repo WILL be opened and a stub reads as abandoned.
#   none — no README file at all.
# RENDERER RULE: for stub/none, print the project but DROP the "GitHub" link label.
# The work is real and the bullets stand on their own; the link is what hurts.
# Restore the label the moment the README is written.
#
# conflicts_with: the selector must never print a project whose work is already
# described in the fixed experience block. Ophis bullets cover the market-structure
# and Monte Carlo work; printing those projects too would show the same work twice.

