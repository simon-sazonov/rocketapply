# ── MSc thesis (added 23 Sep 2026). Measured 8 Sep 2026 before the first supervisor
# meeting, reproducible from src/ in the thesis repository. ──

- id: m.thesis.hazard
  claim: "3,510 race-lap risk sets and 83 safety-car and virtual-safety-car deployments"
  raw_value: [3510, 83]
  unit: [risk_sets, events]
  method: "Discrete-time survival extract from FastF1 race-control messages, three strictly complete seasons (2018-2020, 59 races). Base hazard 2.36% per race-lap; 46 of 59 races carried at least one disruption. UNITS WARNING you should state unprompted: a safety car is a race-level event, so the denominator is race-laps (~3.5k), not driver-laps (~200k). Published F1 datasets quote driver-laps and mixing them inflates exposure 20x."
  source: proj.thesis
  verifiable: true

- id: m.thesis.pooling
  claim: "circuit fixed effects collapse out of sample (hold-out calibration slope -0.007)"
  raw_before: -0.007
  raw_after: 0.756
  unit: calibration_slope
  method: "Discrete-time cloglog hazard with a lap-shape spline, trained pre-2020 and tested on 2020. Model B (25 params, circuit fixed effects) has 2.2 events per variable and a hold-out calibration slope of -0.007 - no discrimination at all. Model A (4 params, lap shape only) reaches 0.756. Model C estimates one variance parameter across 27 circuits (tau = 0.241). CAVEAT to state: 0.756 is still below the [0.8, 1.2] band, i.e. mild overfitting on three seasons."
  source: proj.thesis
  verifiable: true
