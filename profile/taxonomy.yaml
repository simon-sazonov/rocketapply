# taxonomy.yaml — the canonical tag vocabulary.
#
# Tags are the matching mechanism, not decoration. Matching works on exact strings, so
# `ML` in one file and `machine learning` in another simply fails to match. Every tag
# used anywhere in profile/ appears below; validate_profile.py can be extended to reject
# anything that does not.
#
# ⚠ RECONCILE THIS WITH THE DEVELOPER. The build spec tells you to ask for taxonomy.py's
# canonical list. That file does not exist yet, so this is a proposal derived from your
# actual work rather than invented up front. When the developer has theirs, diff the two
# and settle on one - do not let both exist.
#
# Spelling convention: British -modelling, -ise where it appears in prose; but -ization
# and -ize forms are kept for tags that are conventionally spelled that way in the field
# (optimization, normalization, regularization). Consistency matters more than correctness here.

aliases:
  # left-hand side is REJECTED, right-hand side is canonical
  ML: machine_learning
  machine learning: machine_learning
  deep learning: deep_learning
  RL: reinforcement_learning
  time series: time_series
  er_modelling: data_modelling
  risk_modeling: risk_modelling
  NLP: nlp
  LLM: llm

# A tag with "0 uses — posting vocabulary" is deliberately not used by any record
# in profile/. It exists so that a POSTING naming that thing resolves to something:
# `matcher.canonical_tags` is a direct lookup, so a term outside this file
# contributes nothing to the signal, and the skill it names can never be ranked
# up. Before these were added, `row.tools` could only ever react to 14 of its 46
# entries — a posting demanding PyTorch printed Bizagi and Flutter instead.
# Do not delete them for being unused; unused is the point.

