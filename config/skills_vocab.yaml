# The controlled skill vocabulary — §17 of the job-search spec.
#
# Every skill the job search can recognise, keyed by a canonical id, with the
# spellings postings actually use. Job descriptions and your own skill list
# (config/my_skills.yaml) are both mapped onto these ids, so "sklearn" in a
# posting matches "scikit-learn" in your profile.
#
#   label           how it is shown
#   category        for grouping on the Profile page
#   synonyms        matched as whole words, case-insensitively
#   case_sensitive  synonyms matched exactly as written — for short tokens
#                   like "R", "ML" or "Go" that are also ordinary words
#
# Add freely. A synonym belongs to exactly one id; the loader rejects a
# duplicate rather than guessing which one you meant.

# ── programming ──────────────────────────────────────────────────────
python:        {label: Python, category: programming, synonyms: [python, python3]}
sql:           {label: SQL, category: programming, synonyms: [sql, postgresql, postgres, mysql, t-sql, pl/sql, sqlite]}
r_lang:        {label: R, category: programming, case_sensitive: true, synonyms: ["R", "RStudio", "tidyverse"]}
scala:         {label: Scala, category: programming, synonyms: [scala]}
java:          {label: Java, category: programming, synonyms: [java]}
cpp:           {label: C++, category: programming, synonyms: ["c++", "cpp"]}
csharp:        {label: "C#", category: programming, synonyms: ["c#", ".net", "dotnet"]}
javascript:    {label: JavaScript, category: programming, synonyms: [javascript, node.js, nodejs]}
typescript:    {label: TypeScript, category: programming, synonyms: [typescript]}
kotlin:        {label: Kotlin, category: programming, synonyms: [kotlin]}
golang:        {label: Go, category: programming, synonyms: [golang]}
rust:          {label: Rust, category: programming, synonyms: [rust]}
matlab:        {label: MATLAB, category: programming, synonyms: [matlab, simulink]}
julia:         {label: Julia, category: programming, case_sensitive: true, synonyms: ["Julia"]}
bash:          {label: Bash / shell, category: programming, synonyms: [bash, shell scripting]}

