 "description": "<p><strong>GiroDisc Racing Brakes - Bellingham, WA</strong></p>\n<p>Full-time, in-person | 4x10 schedule | Senior-level compensation based on experience</p>\n<p><strong>About the Role</strong></p>\n<p>GiroDisc is looking for a hands-on engineering leader to help shape the next generation of our performance brake products. This is not a desk-only management role. The right person will personally design parts, solve hard technical problems, mentor our engineering team, and build the design standards and development discipline needed for GiroDisc\u2019s next stage of growth.</p>\n<p>You will lead a small team of engineers while remaining directly involved in CAD, design reviews, calculations, reverse engineering, prototype evaluation, manufacturing support, customer/vehicle requirements, and production release. We are especially interested in candidates with deep experience in performance brake systems, calipers, rotors, motorsport components, OEM brake/chassis engineering, or high-performance aftermarket product development.</p>\n<p><strong>What You Will Own</strong></p>\n<ul><li>Lead design and development of performance brake components and systems from concept through production release.</li>\n<li>Personally create and review CAD models, drawings, BOMs, revisions, and production-intent documentation.</li>\n<li>Develop and improve GiroDisc design standards for rotors, hats, brackets, calipers, mounting hardware, clearances, tolerances, materials, finishes, and manufacturability.</li>\n<li>Mentor and train the existing engineering team in brake system design, vehicle fitment, caliper/rotor fundamentals, design judgment, inspection methods, and production release discipline.</li>\n<li>Provide technical leadership for new product architecture, including rotor and hat designs, big brake kits, caliper development, mounting brackets, piston sizing, brake balance considerations, and packaging around wheels, suspension, hubs, and uprights.</li>\n<li>Work closely with manufacturing to ensure designs are practical to machine, inspect, assemble, inventory, and service.</li>\n<li>Support reverse engineering of OE components and vehicle packages using CMM/scan/inspection tools, CAD surfacing/layout methods, and sound engineering judgment.</li>\n<li>Create validation plans for fitment, thermal performance, durability, stiffness, runout, torque capacity, service life, and real-world track/street use.</li>\n<li>Collaborate with Sales, Operations, Production, suppliers, dealers, race teams, and customers to translate real requirements into robust products.</li>\n<li>Lead design reviews, risk reviews, root-cause analysis, corrective actions, and continuous improvement projects.</li>\n<li>Help evaluate new technologies, materials, coatings, friction interfaces, manufacturing methods, and testing methods relevant to performance braking.</li>\n<li>Build a culture of engineering ownership: clear requirements, clean CAD, correct drawings, controlled revisions, thoughtful tolerances, and designs that work the first time.</li>\n<li>Provide technical and project leadership across a diverse portfolio of engineering initiatives beyond core product design, driving schedules, resolving roadblocks, and making key decisions to ensure successful project outcomes.</li>\n</ul><p><strong>What You Bring</strong></p>\n<ul><li>8+ years of mechanical/product design experience, with significant responsibility for production-intent parts or systems.</li>\n<li>Strong background in brake systems, motorsport components, chassis/suspension systems, performance aftermarket products, or safety-critical mechanical assemblies.</li>\n<li>Demonstrated ability to lead other engineers while still doing hands-on design work yourself.</li>\n<li>High proficiency in SolidWorks or comparable 3D CAD, including assemblies, drawings, tolerancing, revision control, and design-for-manufacture practices.</li>\n<li>Practical understanding of CNC machining, fixturing, tooling, inspection, GD&amp;T, tolerance stack-ups, material selection, heat treatment, surface finish, and production variation.</li>\n<li>Ability to make sound engineering tradeoffs between performance, weight, stiffness, cost, manufacturability, serviceability, inventory complexity, and customer needs.</li>\n<li>Comfortable using inspection tools and reverse-engineering methods to understand OE vehicle geometry and packaging constraints.</li>\n<li>Strong communication skills with engineers, machinists, production staff, salespeople, suppliers, and technically sophisticated customers.</li>\n<li>A bias toward action, ownership, and practical problem solving. You should enjoy being close to the parts, the machines, and the end users.</li>\n</ul><p><strong>Highly Valuable Experience</strong></p>\n<ul><li>Brake caliper design: piston sizing, seal grooves, bridge stiffness, pad abutments, fluid passages, knockback, thermal behavior, pressure testing, serviceability, and manufacturing methods.</li>\n<li>Rotor and hat design: air gap/vent design, thermal mass, vane geometry, mounting hardware, float, flange flatness, runout control, cracking modes, corrosion protection, and assembly stack-ups.</li>\n<li>Brake system performance: bias, torque calculations, thermal capacity, pad selection, track duty cycles, pedal feel, ABS interaction, and vehicle-level integration.</li>\n<li>Motorsport or track-focused development, including dyno testing, track feedback, race team/customer support, and failure analysis.</li>\n<li>CAE/FEA or thermal analysis experience, especially when used pragmatically to guide design decisions rather than as a substitute for testing.</li>\n<li>Experience in ISO 9001 or similar controlled engineering/release environments.</li>\n<li>Supplier development, casting/forging/machining process knowledge, or bringing a new mechanical product line from blank sheet to production.</li>\n<li>Experience with top level high-performance braking systems, OEM brake/chassis groups, race teams, or similar performance brake environments.</li>\n</ul><p><strong>Who We Are</strong></p>\n<p>GiroDisc is a privately owned U.S. manufacturer of premium two-piece brake rotors and performance braking solutions for enthusiasts, race teams, shops, and high-end sports/exotic vehicles around the world. We design, machine, assemble, and support our products in Bellingham, Washington. Our size allows quick decisions, direct ownership, close connection to manufacturing, and real influence over the product roadmap.</p>\n<p>We believe in excellence, integrity, innovation, customer focus, teamwork, and work-life balance. This is a rare opportunity for a brake systems expert to make an immediate impact without being buried in corporate layers.</p>\n<p><strong>What We Offer</strong></p>\n<ul><li>Competitive senior-level salary based on experience and fit.</li>\n<li>Relocation assistance for the right candidate.</li>\n<li>4x10 work schedule with Fridays off.</li>\n<li>Paid vacation, holidays, and sick leave.</li>\n<li>Paid medical benefits.</li>\n<li>Company-matched 401(k).</li>\n<li>Profit sharing program.</li>\n<li>Collaborative manufacturing environment where engineers are close to the product and the people making it.</li>\n<li>The chance to build meaningful products used by serious drivers, race teams, and performance shops worldwide.</li>\n</ul>",
